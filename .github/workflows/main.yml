name: Build & Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm
      - name: Install Dependencies
        run: pnpm install
      - name: Lint
        run: pnpm lint

  test:
    needs: lint
    strategy:
      matrix:
        include:
          # Test xclip on Ubuntu with Node 22
          - node-version: 22.x
            os: ubuntu-latest
            install-cmd: sudo apt-get update && sudo apt-get install -y xclip xvfb
            test-cmd: xvfb-run -a pnpm test
          # Test xsel on Ubuntu with Node 22
          - node-version: 22.x
            os: ubuntu-latest
            install-cmd: sudo apt-get update && sudo apt-get install -y xsel xvfb
            test-cmd: xvfb-run -a pnpm test
          # Test xclip on Ubuntu with Node 24
          - node-version: 24.x
            os: ubuntu-latest
            install-cmd: sudo apt-get update && sudo apt-get install -y xclip xvfb
            test-cmd: xvfb-run -a pnpm test
          # Test xsel on Ubuntu with Node 24
          - node-version: 24.x
            os: ubuntu-latest
            install-cmd: sudo apt-get update && sudo apt-get install -y xsel xvfb
            test-cmd: xvfb-run -a pnpm test
          # We do not test Wayland support as setting this up in CI is tricky
          # We only test Node 24 on macOS and Windows to reduce CI usage
          - node-version: 24.x
            os: macos-14
          - node-version: 24.x
            os: windows-2025
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup PNPM
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Setup Node v${{ matrix.node-version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm
      - name: Install Clipboard Tool
        if: matrix.install-cmd
        run: ${{ matrix.install-cmd }}
      - name: Install Dependencies
        run: pnpm install
      - name: Build
        run: pnpm build
      - name: Test
        run: ${{ matrix.test-cmd || 'pnpm test' }}

  # WSL needs its own job: the distribution is installed on a Windows runner and
  # everything (Node included) has to be set up inside it.
  test-wsl:
    needs: lint
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup WSL
        uses: Vampire/setup-wsl@d1da7f2c0322a5ee4f24975344f67fc0f5baf364 # v7.0.0
        with:
          distribution: Ubuntu-24.04
          additional-packages: ca-certificates curl
      - name: Setup Node
        shell: wsl-bash {0}
        run: |
          curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
          apt-get install -y nodejs
          # Corepack picks up the pnpm version pinned in `package.json`,
          # the same way `pnpm/action-setup` does for the other jobs.
          # Job-level `env` does not cross into WSL, hence the `export`.
          export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
          corepack enable pnpm
          corepack install
      - name: Install Dependencies, Build & Test
        shell: wsl-bash {0}
        run: |
          # Work outside of the Windows drive mount: pnpm relies on symlinks,
          # which are slow and unreliable on drvfs.
          cp -r . ~/tinyclip
          cd ~/tinyclip
          export COREPACK_ENABLE_DOWNLOAD_PROMPT=0
          pnpm install
          pnpm build
          # Warm up the Windows interop layer so the first PowerShell spawn of
          # the test run does not hit the 3s timeout.
          powershell.exe -NoProfile -Command exit
          pnpm test
